name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - run: go vet ./...
      - run: go test -race ./...
      - name: generated code is up to date
        run: go tool ego generate -check ./...
      - name: .ego files are formatted
        run: test -z "$(go tool ego fmt -l .)"
      - run: test -z "$(gofmt -l .)"
      - name: example
        working-directory: examples/articles
        run: |
          go vet ./...
          go test -race ./...
          go tool ego generate -check ./...

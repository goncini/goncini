name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # goncini, then the modules of its adapters and of the examples;
        # pgxdb has a job of its own, with PostgreSQL.
        module: [., db/goosedb, db/migratedb, db/gormdb, log/zaplog, log/zerologlog, otel/otlp, mailer/ses, examples/maintenance, examples/articles, examples/realworld, examples/realworld-plain, examples/heartbeat]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: install hurl, for RealWorld's suite
        if: startsWith(matrix.module, 'examples/realworld')
        run: |
          curl -sSLo /tmp/hurl.deb https://github.com/Orange-OpenSource/hurl/releases/download/8.0.1/hurl_8.0.1_amd64.deb
          sudo apt-get install -y /tmp/hurl.deb
      - run: go vet ./...
      - run: go test -race ./...
      - name: generated code is up to date
        if: matrix.module != 'examples/realworld-plain' # plain Go
        run: go tool ego generate -check ./...
      - name: autoconfiguration is up to date
        if: matrix.module == 'examples/articles' || matrix.module == 'examples/realworld' || matrix.module == 'examples/heartbeat'
        run: go tool goncini generate -check
      - name: .ego and Go files are formatted
        if: matrix.module == '.'
        run: |
          test -z "$(go tool ego fmt -l .)"
          test -z "$(gofmt -l .)"

  pgxdb:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      PGXDB_TEST_URL: postgres://postgres:postgres@localhost:5432/postgres
    defaults:
      run:
        working-directory: db/pgxdb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: db/pgxdb/go.sum
      - run: go vet ./...
      - run: go test -race ./...
      - name: generated code is up to date
        run: go tool ego generate -check ./...

  redis:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [cache/rediscache, redis]
    services:
      redis:
        image: redis:8
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      REDISCACHE_TEST_URL: redis://localhost:6379/0
      REDIS_TEST_URL: redis://localhost:6379/0
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - run: go vet ./...
      - run: go test -race ./...
      - name: generated code is up to date
        run: go tool ego generate -check ./...

  amqp:
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:4
        env: # guest may only connect from the broker's own host
          RABBITMQ_DEFAULT_USER: goncini
          RABBITMQ_DEFAULT_PASS: goncini
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping" --health-interval 5s --health-timeout 10s --health-retries 20
    env:
      AMQP_TEST_URL: amqp://goncini:goncini@localhost:5672/
    defaults:
      run:
        working-directory: messenger/amqp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: messenger/amqp/go.sum
      - run: go vet ./...
      - run: go test -race ./...
      - name: generated code is up to date
        run: go tool ego generate -check ./...

  sqs:
    runs-on: ubuntu-latest
    services:
      elasticmq: # SQS's API
        image: softwaremill/elasticmq-native
        ports: ["9324:9324"]
    env:
      SQS_TEST_ENDPOINT: http://localhost:9324
    defaults:
      run:
        working-directory: messenger/sqs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: messenger/sqs/go.sum
      - run: go vet ./...
      - run: go test -race ./...
      - name: generated code is up to date
        run: go tool ego generate -check ./...

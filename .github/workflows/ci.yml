name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # goncini, then the modules of its adapters and of the example;
        # pgxdb has a job of its own, with PostgreSQL.
        module: [., db/goosedb, db/migratedb, db/gormdb, examples/articles, examples/realworld]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: install hurl, for RealWorld's suite
        if: matrix.module == 'examples/realworld'
        run: |
          curl -sSLo /tmp/hurl.deb https://github.com/Orange-OpenSource/hurl/releases/download/8.0.1/hurl_8.0.1_amd64.deb
          sudo apt-get install -y /tmp/hurl.deb
      - run: go vet ./...
      - run: go test -race ./...
      - name: generated code is up to date
        run: go tool ego generate -check ./...
      - name: .ego and Go files are formatted
        if: matrix.module == '.'
        run: |
          test -z "$(go tool ego fmt -l .)"
          test -z "$(gofmt -l .)"

  pgxdb:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      PGXDB_TEST_URL: postgres://postgres:postgres@localhost:5432/postgres
    defaults:
      run:
        working-directory: db/pgxdb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: db/pgxdb/go.sum
      - run: go vet ./...
      - run: go test -race ./...
      - name: generated code is up to date
        run: go tool ego generate -check ./...
